<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Enter Key</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  #canvas-wrap {
    width: 100%;
    height: 100%;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="canvas-wrap"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
<script>
const wrap = document.getElementById('canvas-wrap');
const isSmall = Math.min(window.innerWidth, window.innerHeight) < 500;

// ---------- Scene setup ----------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, wrap.clientWidth / wrap.clientHeight, 0.1, 100);
const VIEW_DIR = new THREE.Vector3(0, -2.3, 9).normalize();
const LOOK_AT = new THREE.Vector3(0, 0.15, 0);

const renderer = new THREE.WebGLRenderer({ antialias: !isSmall, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isSmall ? 1.5 : 2));
renderer.localClippingEnabled = true;
wrap.appendChild(renderer.domElement);

let objSize = null;

function fitCameraToObject() {
  if (!objSize) return;
  const vFovRad = (camera.fov * Math.PI) / 180;
  const margin = 1.35;
  const distForHeight = (objSize.y * margin) / 2 / Math.tan(vFovRad / 2);
  const hFovHalf = Math.atan(Math.tan(vFovRad / 2) * camera.aspect);
  const distForWidth = (objSize.x * margin) / 2 / Math.tan(hFovHalf);
  const distance = Math.max(distForHeight, distForWidth);
  camera.position.copy(VIEW_DIR).multiplyScalar(distance);
  camera.lookAt(LOOK_AT);
}

function fitToWrap() {
  const w = wrap.clientWidth || window.innerWidth;
  const h = wrap.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  fitCameraToObject();
}
fitToWrap();
window.addEventListener('load', fitToWrap);
setTimeout(fitToWrap, 300);

// ---------- Build the extruded "ENTER" keycap ----------
const group = new THREE.Group();
scene.add(group);

let keyMesh = null;
let pressed = false;
let pressAnim = 0;
const KEY_TRAVEL = 0.7; // how far it sinks - most of the thickness

const capColorBase = 0.2; // 0x333333 - flat matte, no lighting/specular at all
const sideMat = new THREE.MeshBasicMaterial({ color: 0x0d0d0d });
const capMat = new THREE.MeshBasicMaterial({ color: 0x333333 });

// Fixed "keyboard deck" plane - nothing behind this world-space Z survives,
// even though no visible keyboard geometry exists. The key mesh slides
// backward through it on press, getting progressively clipped away.
const deckPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
capMat.clippingPlanes = [deckPlane];
sideMat.clippingPlanes = [deckPlane];

const fontLoader = new THREE.FontLoader();
fontLoader.load(
  'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/droid/droid_sans_bold.typeface.json',
  (font) => {
    const textGeo = new THREE.TextGeometry('ENTER', {
      font: font,
      size: 2,
      height: 1.3,
      curveSegments: 6,
      bevelEnabled: true,
      bevelThickness: 0.12,
      bevelSize: 0.07,
      bevelSegments: 4,
    });
    textGeo.center();
    textGeo.computeBoundingBox();
    const bb = textGeo.boundingBox;
    objSize = new THREE.Vector3(bb.max.x - bb.min.x, bb.max.y - bb.min.y, bb.max.z - bb.min.z);

    // Place the deck exactly at the rest position of the key's rear face -
    // fully visible at rest, clipped only once it slides past this line.
    deckPlane.constant = -bb.min.z;

    keyMesh = new THREE.Mesh(textGeo, [capMat, sideMat]);
    group.add(keyMesh);
    fitCameraToObject();
  }
);

// ---------- Press interaction ----------
function setPressed(state) { pressed = state; }
wrap.addEventListener('pointerdown', () => setPressed(true));
window.addEventListener('pointerup', () => setPressed(false));
wrap.addEventListener('pointerleave', () => setPressed(false));
wrap.addEventListener('touchstart', (e) => { e.preventDefault(); setPressed(true); }, { passive: false });
wrap.addEventListener('touchend', () => setPressed(false));
wrap.addEventListener('touchcancel', () => setPressed(false));

// ---------- Resize ----------
window.addEventListener('resize', fitToWrap);

// ---------- Animate ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);

  const target = pressed ? 1 : 0;
  pressAnim += (target - pressAnim) * (pressed ? 0.35 : 0.18);

  if (keyMesh) {
    keyMesh.position.z = -pressAnim * KEY_TRAVEL;
    const dim = 1 - pressAnim * 0.3;
    capMat.color.setRGB(capColorBase * dim, capColorBase * dim, capColorBase * dim);
  }

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
